<div class="admin-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <mat-icon>history</mat-icon>
        Quản Lý Nhật Ký Hệ Thống
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="loading" class="loading">Đang tải...</div>

      <table mat-table [dataSource]="auditLogs" class="mat-elevation-z8" *ngIf="!loading">
        <ng-container matColumnDef="logId">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let log">{{log.logId}}</td>
        </ng-container>

        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef>User ID</th>
          <td mat-cell *matCellDef="let log">{{log.userId}}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Hành Động</th>
          <td mat-cell *matCellDef="let log">{{log.action}}</td>
        </ng-container>

        <ng-container matColumnDef="details">
          <th mat-header-cell *matHeaderCellDef>Chi Tiết</th>
          <td mat-cell *matCellDef="let log">{{log.details}}</td>
        </ng-container>

        <ng-container matColumnDef="ipAddress">
          <th mat-header-cell *matHeaderCellDef>IP Address</th>
          <td mat-cell *matCellDef="let log">{{log.ipAddress || '-'}}</td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Thời Gian</th>
          <td mat-cell *matCellDef="let log">{{log.createdAt | date:'dd/MM/yyyy HH:mm:ss'}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="!loading && auditLogs.length === 0" class="no-data">
        <p>Không có dữ liệu</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
