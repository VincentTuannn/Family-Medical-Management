<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Đăng Nhập Admin</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username">
          <mat-error *ngIf="loginForm.get('username')?.invalid">Username bắt buộc</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="loginForm.get('password')?.invalid">Password ít nhất 6 ký tự</mat-error>
        </mat-form-field>

        <!-- Hiển thị lỗi nếu có -->
        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="login-btn">
          Đăng Nhập
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
